[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x509path"
version = "0.1.0"
description = "Restricted offline X.509 path validation CLI (P-256 / ECDSA-SHA256, DNS and IP)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
x509path = "x509path.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
